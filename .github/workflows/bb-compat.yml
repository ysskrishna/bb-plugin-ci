name: BB compat

# Reusable workflow. When a BB release falls outside the plugin's engines.bb,
# is a prerelease asked for by bb-version, or always-test is set, run the
# plugin's checks against it and keep one open `bb-compat` issue with the
# result. Close that issue once the plugin passes, or once engines.bb includes
# the latest BB.
on:
  workflow_call:
    outputs:
      tested:
        description: "true when the checks ran"
        value: ${{ jobs.check.outputs.test }}
      action:
        description: "What happened to the bb-compat issue: created, updated, closed or none"
        value: ${{ jobs.report.outputs.action }}
      issue:
        description: The bb-compat issue number acted on, if any
        value: ${{ jobs.report.outputs.issue }}
    inputs:
      bb-version:
        description: bb-app version or dist-tag to test. Empty means latest.
        type: string
        default: ""
      repository:
        description: Plugin repository to check out. Empty means the calling repository.
        type: string
        default: ""
      node-version:
        type: string
        default: "22"
      codex-version:
        description: Install this @openai/codex version globally. Empty skips it.
        type: string
        default: ""
      apt-packages:
        description: Space-separated apt packages to install, for example "lsof procps".
        type: string
        default: ""
      setup:
        description: Extra shell commands to run after npm ci.
        type: string
        default: ""
      always-test:
        description: Run the checks even when the BB under test is a stable release inside engines.bb.
        type: boolean
        default: false
      fail-on-error:
        description: Fail the run when a check fails. When false, the failure is only reported in the issue.
        type: boolean
        default: true
      checks:
        description: One command per line, each run with a clean environment (only PATH and HOME).
        type: string
        default: |
          npm run typecheck
          npm run e2e:smoke

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      range: ${{ steps.resolve.outputs.range }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      latest: ${{ steps.resolve.outputs.latest }}
      in-range: ${{ steps.resolve.outputs.in-range }}
      test: ${{ steps.resolve.outputs.test }}
      sdk: ${{ steps.install.outputs.sdk }}
      failed: ${{ steps.checks.outputs.failed }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Resolve bb-app and engines.bb
        id: resolve
        env:
          BB_VERSION: ${{ inputs.bb-version || 'latest' }}
          ALWAYS_TEST: ${{ inputs.always-test }}
        run: |
          set -euo pipefail
          version=$(npm view "bb-app@$BB_VERSION" version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bb-app@$BB_VERSION resolved to '$version'"; exit 1; }
          range=$(node -p 'require("./package.json").engines?.bb ?? ""')
          [ -n "$range" ] || { echo "::error::package.json has no engines.bb"; exit 1; }
          npm install --prefix "$RUNNER_TEMP/semver" --no-audit --no-fund --silent semver@7
          in_range=$(node -e '
            const semver = require(process.argv[1]);
            const [range, version] = process.argv.slice(2);
            if (!semver.validRange(range)) throw new Error(`engines.bb is not a valid range: ${range}`);
            console.log(semver.satisfies(version, range));
          ' "$RUNNER_TEMP/semver/node_modules/semver" "$range" "$version")
          prerelease=false; [[ "$version" == *-* ]] && prerelease=true
          latest=false; [ "$version" = "$(npm view bb-app@latest version)" ] && latest=true
          # A prerelease is only tested when asked for, and then always tested.
          test=true
          [ "$in_range" = true ] && [ "$prerelease" = false ] && [ "$ALWAYS_TEST" != true ] && test=false
          echo "bb-app $version, engines.bb $range, in range: $in_range, prerelease: $prerelease, test: $test"
          { echo "version=$version"; echo "range=$range"; echo "prerelease=$prerelease"; echo "latest=$latest"
            echo "in-range=$in_range"; echo "test=$test"; } >> "$GITHUB_OUTPUT"
      - if: steps.resolve.outputs.test == 'true'
        run: npm ci
      - if: steps.resolve.outputs.test == 'true' && inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: sudo apt-get update && sudo apt-get install -y $APT_PACKAGES
      - if: steps.resolve.outputs.test == 'true' && inputs.codex-version != ''
        env:
          CODEX_VERSION: ${{ inputs.codex-version }}
        run: npm install --global "@openai/codex@$CODEX_VERSION"
      - if: steps.resolve.outputs.test == 'true' && inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"
      - name: Install bb-app and the plugin SDK it ships
        id: install
        if: steps.resolve.outputs.test == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          tarball=$(npm pack "bb-app@$VERSION" --silent --pack-destination "$RUNNER_TEMP")
          sdk=$(tar -xzOf "$RUNNER_TEMP/$tarball" package/dist/index.js | grep -oE 'PLUGIN_SDK_VERSION ?= ?"[^"]+"' | sort -u | cut -d'"' -f2 || true)
          [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*$ ]] || { echo "::error::No single PLUGIN_SDK_VERSION in bb-app $VERSION: '$sdk'"; exit 1; }
          npm install --no-save --no-audit --no-fund "bb-app@$VERSION" "@get-bb/plugin-sdk@$sdk"
          node -e '
            const { readFileSync } = require("node:fs");
            const installed = (name) => JSON.parse(readFileSync(`node_modules/${name}/package.json`, "utf8")).version;
            for (const [name, want] of [["bb-app", process.argv[1]], ["@get-bb/plugin-sdk", process.argv[2]]]) {
              if (installed(name) !== want) throw new Error(`wanted ${name} ${want}, installed ${installed(name)}`);
            }
          ' "$VERSION" "$sdk"
          # BB refuses to run a plugin whose engines.bb excludes it, so the
          # working copy (never committed) declares the version under test.
          npm pkg set "engines.bb=$VERSION"
          echo "bb-app $VERSION ships @get-bb/plugin-sdk $sdk; engines.bb set to $VERSION for the checks"
          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
      - name: Run checks
        id: checks
        if: steps.resolve.outputs.test == 'true'
        env:
          CHECKS: ${{ inputs.checks }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        run: |
          fail() {
            echo "failed=$1" >> "$GITHUB_OUTPUT"
            if [ "$FAIL_ON_ERROR" = true ]; then echo "::error::$2"; exit 1; fi
            echo "::warning::$2 (fail-on-error is off; the issue records it)"
            exit 0
          }
          ran=0
          while IFS= read -r cmd; do
            [[ -z "${cmd// /}" ]] && continue
            ran=$((ran + 1))
            echo "::group::$cmd"
            if ! env -i PATH="$PATH" HOME="$HOME" bash -euo pipefail -c "$cmd"; then
              echo "::endgroup::"
              fail "$cmd" "Check failed: $cmd"
            fi
            echo "::endgroup::"
          done <<< "$CHECKS"
          if [ "$ran" -eq 0 ]; then fail "(the checks input is empty)" "The checks input has no commands"; fi
      - if: failure() || steps.checks.outputs.failed != ''
        uses: actions/upload-artifact@v4
        with:
          name: bb-compat-${{ steps.resolve.outputs.version }}-${{ github.run_attempt }}
          path: e2e-artifacts/
          if-no-files-found: ignore

  report:
    needs: check
    # Fork and Dependabot pull requests get a read-only token, so they skip the issue.
    if: >-
      !cancelled() && needs.check.outputs.version != '' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: bb-compat-report-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      action: ${{ steps.issue.outputs.action }}
      issue: ${{ steps.issue.outputs.issue }}
    steps:
      - name: Open, update or close the bb-compat issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.repository || github.repository }}
          LATEST: ${{ needs.check.outputs.latest }}
          VERSION: ${{ needs.check.outputs.version }}
          RANGE: ${{ needs.check.outputs.range }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          IN_RANGE: ${{ needs.check.outputs.in-range }}
          TESTED: ${{ needs.check.outputs.test }}
          SDK: ${{ needs.check.outputs.sdk }}
          RESULT: ${{ needs.check.result }}
          FAILED: ${{ needs.check.outputs.failed }}
          CHECKS: ${{ inputs.checks }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label bb-compat --state open --limit 1 \
            --json number,title --jq '.[] | "\(.number) \(.title)"')
          number=${open%% *}
          title=${open#* }
          if [ "$TESTED" != true ]; then
            # Only the latest BB decides that engines.bb has caught up.
            if [ "$LATEST" = true ] && [ -n "$number" ]; then
              gh issue close "$number" --comment "engines.bb \`$RANGE\` includes the latest bb, $VERSION. Run: $RUN_URL"
              { echo "action=closed"; echo "issue=$number"; } >> "$GITHUB_OUTPUT"
            else
              echo "action=none" >> "$GITHUB_OUTPUT"
            fi
            echo "bb $VERSION is inside engines.bb $RANGE; nothing to test." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ok=true
          if [ -n "$FAILED" ] || [ "$RESULT" != success ]; then ok=false; fi
          if [ "$IN_RANGE" = true ] && [ "$PRERELEASE" = false ]; then
            # Tested because of always-test: a pass settles any open issue.
            if [ "$ok" = true ]; then
              if [ -n "$number" ]; then
                gh issue close "$number" --comment "bb $VERSION passes the checks. Run: $RUN_URL"
                { echo "action=closed"; echo "issue=$number"; } >> "$GITHUB_OUTPUT"
              else
                echo "action=none" >> "$GITHUB_OUTPUT"
              fi
              echo "bb $VERSION passes the checks." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            intro="bb-app $VERSION (plugin SDK ${SDK:-unknown}) is inside \`engines.bb\` \`$RANGE\` of $PLUGIN."
          elif [ "$PRERELEASE" = true ]; then
            intro="bb-app $VERSION (plugin SDK ${SDK:-unknown}) is a prerelease. \`engines.bb\` of $PLUGIN is \`$RANGE\`."
          else
            intro="bb-app $VERSION (plugin SDK ${SDK:-unknown}) is outside \`engines.bb\` \`$RANGE\` of $PLUGIN."
          fi
          if [ "$ok" = true ] && [ "$PRERELEASE" = true ]; then
            new_title="bb $VERSION passes the checks (prerelease)"
            outcome="All checks passed. Nothing to change until a stable release falls outside \`engines.bb\`."
          elif [ "$ok" = true ]; then
            new_title="bb $VERSION passes: widen engines.bb to include it"
            outcome="All checks passed, so it is safe to widen \`engines.bb\` to include $VERSION."
          elif [ -n "$FAILED" ]; then
            new_title="bb $VERSION fails: $FAILED"
            outcome="\`$FAILED\` failed. See the run log for details."
          else
            new_title="bb $VERSION fails during setup"
            outcome="Setup failed before the checks ran (npm ci, tools, or the bb-app and SDK install). See the run log."
          fi
          body="$intro

          $outcome

          Checks:
          $(sed '/^[[:space:]]*$/d; s/^/- `/; s/$/`/' <<< "$CHECKS")

          Run: $RUN_URL

          The bb-compat workflow updates this issue and closes it once the checks pass or \`engines.bb\` includes the latest bb."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          old_version=$(cut -d' ' -f2 <<< "$title")
          if [ "$PRERELEASE" = true ] && [ -n "$number" ] && [[ "$old_version" != *-* ]]; then
            echo "Left issue #$number alone: a prerelease result does not replace a stable one." >> "$GITHUB_STEP_SUMMARY"
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif [ -z "$number" ]; then
            gh label create bb-compat --color FBCA04 --description "BB compatibility check" --force
            url=$(gh issue create --title "$new_title" --body "$body" --label bb-compat)
            echo "$url"
            { echo "action=created"; echo "issue=${url##*/}"; } >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$number" --title "$new_title" --body "$body"
            if [ "$title" != "$new_title" ]; then
              gh issue comment "$number" --body "Result changed: $new_title. Run: $RUN_URL"
            fi
            { echo "action=updated"; echo "issue=$number"; } >> "$GITHUB_OUTPUT"
          fi
